[main]
font=CodeNewRoman Nerd Font Mono:size=16
pad=8x8
term=xterm-256color
shell=/run/current-system/sw/bin/zsh

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
primary-paste=none
clipboard-paste=Control+Shift+V
clipboard-paste=Shift+Insert

[mouse-bindings]
primary-paste=none

[colors-dark]
alpha=0.60
foreground=cdd6f4
background=11111b

regular0=181825
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=cdd6f4

bright0=45475a
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=f5e0dc

[csd]
preferred=none
