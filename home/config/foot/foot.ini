[main]
font=JetBrainsMono Nerd Font:size=14
pad=8x8
term=xterm-256color
shell=/run/current-system/sw/bin/bash

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.60
foreground=cdd6f4
background=11111b

regular0=181825
