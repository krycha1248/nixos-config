[main]
font=JetBrainsMono Nerd Font:size=14
terminal=foot
prompt="❯  "
icon-theme=Papirus-Dark
icons-enabled=yes
lines=10
width=45
horizontal-pad=16
vertical-pad=10
inner-pad=8
line-height=28
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2eee
text=cdd6f4ff
match=f5c2e7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
border=89b4faff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=no
list-executables-in-path=yes
