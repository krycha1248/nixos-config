# ============================================================
# Hyprland — Catppuccin Mocha
# ============================================================

# ---------- Monitors ----------

source = ~/.config/hypr/monitors.conf
exec-once = hyprdynamicmonitors run
#monitor = eDP-1,1680x1050,0x0,1.05
#monitor=,preferred,auto,1


# ---------- Environment ----------

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24

env = HYPRCURSOR_SIZE,24

# ---------- Startup ----------

exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = mako
exec-once = blueman-applet
exec-once = quickshell -p ~/.config/quickshell
exec-once = poweralertd


# ---------- General ----------

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(45475aaa)

    layout = dwindle

    allow_tearing = false
}

xwayland {
    force_zero_scaling = true
}

dwindle {
    preserve_split = true
}


misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


# ---------- Decoration ----------

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
}

layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = on
}

# ---------- Animations ----------

animations {
    enabled = true

    bezier = macos, 0.22, 1.0, 0.36, 1.0
    bezier = macosOut, 0.16, 1.0, 0.3, 1.0
    bezier = macosInOut, 0.4, 0.0, 0.2, 1.0

    # Windows
    animation = windows, 1, 6, macos
    animation = windowsOut, 1, 6, macosOut

    # UI
    animation = border, 1, 6, macos
    animation = fade, 1, 6, macosOut

    # Workspaces
    animation = workspaces, 1, 4, macosInOut
}


# ---------- Input ----------

input {
    kb_layout = pl

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

device {
    name = tpps/2-elan-trackpoint
    sensitivity = -0.2
    scroll_factor = 0.5
}


# ---------- Keybinds ----------

$mainMod = SUPER

# Terminal
bind = $mainMod, Return, exec, foot

# Close window
bind = $mainMod, Q, killactive

# Fullscreen
bind = $mainMod, F, fullscreen

# Toggle floating
bind = $mainMod, V, togglefloating

# Reload config
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Exit Hyprland
bind = $mainMod SHIFT, Q, exec, wlogout

# Lock Hyprland
bind = $mainMod, L, exec, hyprlock

# Fuzzel
bind = $mainMod, SPACE, exec, fuzzel

# Bluetooth
bind = $mainMod, B, exec, ~/.local/bin/bluetooth-menu

# Toggle split
bind = $mainMod, P, layoutmsg, togglesplit


# ---------- Focus ----------

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d


# ---------- Move windows ----------

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d


# ---------- Workspaces ----------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9


# Move window to workspace

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9


# ---------- Mouse ----------

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ---------- Brightness ----------

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && notify-send -h string:x-canonical-private-synchronous:brightness -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d '%') "Brightness"
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send -h string:x-canonical-private-synchronous:brightness -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d '%') "Brightness"


# ---------- Audio ----------

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -h string:x-canonical-private-synchronous:volume -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%.0f", $2 * 100}') "Volume"
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -h string:x-canonical-private-synchronous:volume -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%.0f", $2 * 100}') "Volume"

bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -h string:x-canonical-private-synchronous:volume "Volume"
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send -h string:x-canonical-private-synchronous:mic "Microphone"


# ---------- Media ----------

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous


# ---------- Screenshots ----------

bind = , Print, exec, hyprshot -m output --clipboard-only
bind = ALT, Print, exec, hyprshot -m window --clipboard-only
bind = SUPER SHIFT, S, exec, hyprshot -m region --raw | swappy -f -
